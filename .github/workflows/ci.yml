name: CI

on:
  push:
    branches:
      - dev
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Typecheck, Test & Build
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: test
          POSTGRES_DB: authsphere_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d authsphere_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:8-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      NODE_ENV: test
      PORT: 3001
      DATABASE_URL: postgresql://postgres:test@localhost:5432/authsphere_test
      REDIS_URL: redis://localhost:6379/1
      FRONTEND_URL: http://localhost:5173
      JWT_ACCESS_SECRET: test-access-secret-minimum-16-chars
      JWT_REFRESH_SECRET: test-refresh-secret-minimum-16-chars
      JWT_ACCESS_EXPIRES_IN: 15m
      JWT_REFRESH_EXPIRES_IN: 30d
      AUTH_REUSE_DELETION_MODE: SESSION
      MFA_ENCRYPTION_KEY: test-mfa-encryption-key-min16
      GOOGLE_CLIENT_ID: test-google-client-id
      GOOGLE_CLIENT_SECRET: test-google-client-secret
      GITHUB_CLIENT_ID: test-github-client-id
      GITHUB_CLIENT_SECRET: test-github-client-secret
      OAUTH_CALLBACK_BASE_URL: http://localhost:3001/auth/oauth
      TRUST_PROXY: false
      RESEND_API_KEY: resend_test_dummy_key_for_testing
      EMAIL_FROM: AuthSphere <noreply@authsphere.dev>

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Apply test database migrations
        run: npm run db:migrate:deploy --workspace=@authsphere/api

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          tags: authsphere-api:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
