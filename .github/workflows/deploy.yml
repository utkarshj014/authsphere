name: Deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  packages: write
  id-token: write

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  validate:
    name: Validate
    uses: ./.github/workflows/ci.yml
    secrets: inherit

  deploy:
    name: Release & Deploy
    needs: validate
    runs-on: ubuntu-latest

    env:
      IMAGE_NAME: ghcr.io/${{ github.repository }}/backend
      DEPLOY_TARGET: ${{ vars.DEPLOY_TARGET || 'serverless' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm

      - name: Install dependencies
        run: |
          npm ci
          npm --prefix infra/lambda ci --omit=dev

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION || 'ap-south-1' }}

      - name: Run production database migrations
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL_DIRECT }}
        run: npm run db:migrate:deploy --workspace=@authsphere/api

      - name: Deploy to AWS Lambda (SAM)
        if: env.DEPLOY_TARGET != 'ecs'
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/authsphere_build
        run: |
          npm run build:lambda
          cd infra/lambda

          PARAMS=()
          add_param() { [ -n "$2" ] && PARAMS+=("$1=$2"); }

          add_param "DatabaseUrl" "${{ secrets.DATABASE_URL_POOLED }}"
          add_param "RedisUrl" "${{ secrets.REDIS_URL }}"
          add_param "FrontendUrl" "${{ vars.FRONTEND_URL || 'https://authsphere-iota.vercel.app' }}"
          add_param "JwtAccessSecret" "${{ secrets.JWT_ACCESS_SECRET }}"
          add_param "JwtRefreshSecret" "${{ secrets.JWT_REFRESH_SECRET }}"
          add_param "MfaEncryptionKey" "${{ secrets.MFA_ENCRYPTION_KEY }}"
          add_param "EmailFrom" "${{ secrets.EMAIL_FROM || 'AuthSphere <noreply@authsphere.dev>' }}"
          add_param "EmailProvider" "${{ vars.EMAIL_PROVIDER || 'gmail' }}"
          add_param "GmailUser" "${{ vars.GMAIL_USER }}"
          add_param "GmailRefreshToken" "${{ secrets.GMAIL_REFRESH_TOKEN }}"
          add_param "ResendApiKey" "${{ secrets.RESEND_API_KEY }}"
          add_param "GoogleClientId" "${{ vars.GOOGLE_CLIENT_ID }}"
          add_param "GoogleClientSecret" "${{ secrets.GOOGLE_CLIENT_SECRET }}"
          add_param "GithubClientId" "${{ vars.GH_OAUTH_CLIENT_ID }}"
          add_param "GithubClientSecret" "${{ secrets.GH_OAUTH_CLIENT_SECRET }}"
          add_param "OAuthCallbackBaseUrl" "${{ vars.OAUTH_CALLBACK_BASE_URL }}"

          sam deploy --no-confirm-changeset --no-fail-on-empty-changeset \
            --region ${{ vars.AWS_REGION || 'ap-south-1' }} \
            --parameter-overrides "${PARAMS[@]}"

          FUNCTION_URL=$(aws cloudformation describe-stacks \
            --stack-name authsphere-serverless \
            --region ${{ vars.AWS_REGION || 'ap-south-1' }} \
            --query "Stacks[0].Outputs[?OutputKey=='FunctionUrl'].OutputValue" \
            --output text)
          echo "FUNCTION_URL=$FUNCTION_URL" >> $GITHUB_ENV

      - name: Smoke test Lambda deployment (Liveness & Readiness)
        if: env.DEPLOY_TARGET != 'ecs'
        run: |
          echo "Verifying process liveness at: ${FUNCTION_URL}health/live"
          curl --fail --retry 3 --retry-delay 5 --max-time 15 "${FUNCTION_URL}health/live"
          echo "Verifying dependency readiness at: ${FUNCTION_URL}health/ready"
          curl --fail --retry 3 --retry-delay 5 --max-time 15 "${FUNCTION_URL}health/ready"

      - name: Set up Docker Buildx
        if: env.DEPLOY_TARGET == 'ecs'
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        if: env.DEPLOY_TARGET == 'ecs'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        if: env.DEPLOY_TARGET == 'ecs'
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=sha,prefix=,format=short
            type=raw,value=latest

      - name: Build and push Docker image
        if: env.DEPLOY_TARGET == 'ecs'
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Inject AWS Account ID into ECS task definitions
        if: env.DEPLOY_TARGET == 'ecs'
        run: |
          ACCOUNT_ID="${{ vars.AWS_ACCOUNT_ID }}"
          if [ -z "$ACCOUNT_ID" ]; then
            ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)
          fi
          sed -i "s|<ACCOUNT_ID>|${ACCOUNT_ID}|g" infra/ecs/api-task-definition.json infra/ecs/worker-task-definition.json

      - name: Render ECS API task definition
        if: env.DEPLOY_TARGET == 'ecs'
        id: render-api-container
        uses: aws-actions/amazon-ecs-render-task-definition@v1
        with:
          task-definition: infra/ecs/api-task-definition.json
          container-name: authsphere-api
          image: ${{ env.IMAGE_NAME }}:${{ steps.meta.outputs.version }}

      - name: Deploy API to Amazon ECS
        if: env.DEPLOY_TARGET == 'ecs'
        uses: aws-actions/amazon-ecs-deploy-task-definition@v2
        with:
          task-definition: ${{ steps.render-api-container.outputs.task-definition }}
          service: authsphere-api
          cluster: authsphere-cluster
          wait-for-service-stability: true

      - name: Render ECS Worker task definition
        if: env.DEPLOY_TARGET == 'ecs' && vars.DEPLOY_ECS_WORKER == 'true'
        id: render-worker-container
        uses: aws-actions/amazon-ecs-render-task-definition@v1
        with:
          task-definition: infra/ecs/worker-task-definition.json
          container-name: authsphere-worker
          image: ${{ env.IMAGE_NAME }}:${{ steps.meta.outputs.version }}

      - name: Deploy Background Worker to Amazon ECS
        if: env.DEPLOY_TARGET == 'ecs' && vars.DEPLOY_ECS_WORKER == 'true'
        uses: aws-actions/amazon-ecs-deploy-task-definition@v2
        with:
          task-definition: ${{ steps.render-worker-container.outputs.task-definition }}
          service: authsphere-worker
          cluster: authsphere-cluster
          wait-for-service-stability: false
