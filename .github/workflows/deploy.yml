name: Deploy

on:
  push:
    branches:
      - main

permissions:
  contents: read
  packages: write
  id-token: write

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  release:
    name: Release & Deploy
    runs-on: ubuntu-latest
    environment: production

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: test
          POSTGRES_DB: authsphere_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d authsphere_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:8-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      IMAGE_NAME: ghcr.io/${{ github.repository }}/backend
      NODE_ENV: test
      PORT: 3001
      DATABASE_URL: postgresql://postgres:test@localhost:5432/authsphere_test
      REDIS_URL: redis://localhost:6379/1
      FRONTEND_URL: http://localhost:5173
      JWT_ACCESS_SECRET: test-access-secret-minimum-16-chars
      JWT_REFRESH_SECRET: test-refresh-secret-minimum-16-chars
      JWT_ACCESS_EXPIRES_IN: 15m
      JWT_REFRESH_EXPIRES_IN: 30d
      AUTH_REUSE_DELETION_MODE: SESSION
      AUTH_REFRESH_TOKEN_LEEWAY_SECONDS: 30
      MFA_ENCRYPTION_KEY: test-mfa-encryption-key-min16
      GOOGLE_CLIENT_ID: test-google-client-id
      GOOGLE_CLIENT_SECRET: test-google-client-secret
      GITHUB_CLIENT_ID: test-github-client-id
      GITHUB_CLIENT_SECRET: test-github-client-secret
      OAUTH_CALLBACK_BASE_URL: http://localhost:3001/auth/oauth
      TRUST_PROXY: false
      RESEND_API_KEY: resend_test_dummy_key_for_testing
      EMAIL_FROM: AuthSphere <noreply@authsphere.dev>
      QUEUE_DRIVER: inline

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Apply test database migrations
        run: npm run db:migrate:deploy --workspace=@authsphere/api

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=sha,prefix=sha-,format=long
            type=raw,value=latest

      - name: Build and push Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ap-south-1

      - name: Render ECS task definition
        id: render-api-container
        uses: aws-actions/amazon-ecs-render-task-definition@v1
        with:
          task-definition: infra/ecs/api-task-definition.json
          container-name: authsphere-api
          image: ${{ env.IMAGE_NAME }}:sha-${{ github.sha }}

      - name: Deploy to Amazon ECS
        uses: aws-actions/amazon-ecs-deploy-task-definition@v2
        with:
          task-definition: ${{ steps.render-api-container.outputs.task-definition }}
          service: authsphere-api
          cluster: authsphere-cluster
          wait-for-service-stability: true
